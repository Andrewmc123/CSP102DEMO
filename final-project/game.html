<!-- Andrew McLean - Game Page -->
<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Number Guessing Game</title>

   <!-- link to css file -->
   <link rel="stylesheet" href="style.css">
</head>

<body>

   <!-- main card -->
   <div class="card">

      <h1>Number Guessing Game</h1>
      <p>Guess a number between 1 and 100.</p>

      <!-- form with submit for user input -->
      <form id="guessForm">
         <input type="number" id="guessInput" placeholder="Enter your guess" min="1" max="100" required>
         <br>
         <button type="submit">Submit Guess</button>
         <button type="button" onclick="resetGame()">New Game</button>
      </form>

      <!-- game messages (innerHTML) -->
      <div id="gameMessage" class="message"></div>
      <div id="statsMessage" class="message"></div>

      <!-- back to landing page -->
      <a class="back-link" href="index.html">Back to Home</a>

   </div>

   <!-- link to script file -->
   <script src="game.js"></script>
</body>
</html>
